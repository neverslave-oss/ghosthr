name: Release

# Gitea Actions: builds the extension zip and the Linux AppImage on the default
# Linux runner, then attaches artifacts to the Gitea release for the pushed tag.
# Windows (NSIS) and macOS (DMG) builds require self-hosted runners with the
# matching OS — see the commented jobs at the bottom to enable them.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Extension + Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure zip is available
        run: command -v zip >/dev/null || (apt-get update && apt-get install -y zip)

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package extension zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist && zip -r "../ghosthr-extension-v${VERSION}.zip" .

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Package Linux AppImage
        working-directory: desktop
        run: npx electron-builder --linux AppImage --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Attach artifacts to Gitea release
        uses: https://gitea.com/actions/release-action@main
        with:
          files: |-
            ghosthr-extension-v*.zip
            desktop/release/*.AppImage
          # Built-in token works on recent Gitea; use a PAT secret (e.g.
          # secrets.RELEASE_TOKEN) if release creation is rejected.
          api_key: ${{ github.token }}

