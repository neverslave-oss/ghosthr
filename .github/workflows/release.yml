name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension:
    name: Extension (zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package extension zip
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist && zip -r "../ghosthr-extension-v${VERSION}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ghosthr-extension-v*.zip
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: win
            files: |
              desktop/release/*.exe
              desktop/release/*.exe.blockmap
          - os: ubuntu-latest
            artifact: linux
            files: desktop/release/*.AppImage
          - os: macos-latest
            artifact: mac
            files: desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build extension (bundled as extraResources)
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Package desktop app
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          # No code signing configured yet
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [extension, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
