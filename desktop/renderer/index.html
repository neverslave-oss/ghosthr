<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ghostHR</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #cccccc; --panel: #ffffff; --ink: #1a1a1a; --ink-dim: #666666;
        --accent: #8b5cf6; --accent-2: #06b6d4; --line: #d4d4d4; --ok: #16a34a;
      }
      [data-theme="dark"] {
        --bg: #0f172a; --panel: #1e293b; --ink: #e2e8f0; --ink-dim: #94a3b8;
        --accent: #8b5cf6; --accent-2: #06b6d4; --line: #334155; --ok: #34d399;
      }
      html, body { height: 100%; }
      body {
        display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        background: var(--bg); color: var(--ink);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      header {
        display: flex; align-items: center; gap: 12px; padding: 8px 14px;
        background: var(--panel); border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 8px; }
      .mark {
        width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
        background: var(--accent); color: #fff; font-weight: 800; font-size: 13px;
      }
      .title { font-size: 16px; font-weight: 700; }
      .title span { color: var(--accent); }
      .tabs { display: flex; gap: 4px; margin-left: 8px; }
      .tabs button, .panel-btn {
        background: transparent; border: none; color: var(--ink-dim); cursor: pointer;
        padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
      }
      .tabs button.active { background: var(--bg); color: var(--accent); }
      #urlbar { flex: 1; margin-left: 12px; display: flex; gap: 6px; }
      #urlbar input {
        flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--ink);
        border-radius: 6px; padding: 6px 10px; font-size: 13px;
      }
      #urlbar button {
        background: var(--accent); border: none; color: #fff; border-radius: 6px;
        padding: 6px 12px; cursor: pointer; font-weight: 600;
      }
      .spacer { flex: 1; }
      /* Pinned extension action — ghostHR's own icon, like a browser toolbar pin. */
      .ext-icon-btn {
        display: flex; align-items: center; justify-content: center;
        background: transparent; border: 1px solid var(--line); border-radius: 7px;
        padding: 4px; cursor: pointer;
      }
      .ext-icon-btn img { width: 20px; height: 20px; display: block; }
      .ext-icon-btn.active { background: var(--bg); border-color: var(--accent); }
      .theme-toggle { background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
      main { flex: 1; display: flex; min-width: 0; min-height: 0; }
      .panel { flex: 1; display: none; flex-direction: column; min-width: 0; min-height: 0; }
      .panel.active { display: flex; }
      webview {
        flex: 1; width: 100%; background: var(--bg); border-radius: 6px;
        border: 1px solid var(--line); min-height: 0;
      }
      .browser { padding: 8px; display: flex; flex-direction: column; }
      /* Agent tab — split-screen. Browser LEFT, chat RIGHT. */
      .agent { flex-direction: row; }
      .agent .agent-browser {
        flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 8px;
        border-right: 1px solid var(--line);
      }
      .agent .chat-pane {
        flex: 0 0 42%; display: flex; flex-direction: column; min-width: 0;
        border-left: 1px solid var(--line);
      }
      .agent .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
      .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
      .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
      .msg.bot.streaming::after { content: '▍'; animation: blink 1s steps(2) infinite; color: var(--accent); margin-left: 2px; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .agent .composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
      .agent .composer input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
      .agent .composer button { background: var(--accent); border: none; color: #fff; border-radius: 6px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
      .empty { color: var(--ink-dim); }

      /* ghostHR extension side panel — hosts the extension's OWN popup UI. */
      .side-panel {
        width: 380px; min-width: 320px; max-width: 480px; display: none;
        flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0;
      }
      .side-panel.open { display: flex; }
      .side-panel webview { border: 0; border-radius: 0; }
      .side-panel .sp-head {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px;
        border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600;
      }
      .side-panel .sp-head button { margin-left: auto; background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="mark">HR</div>
        <div class="title">ghost<span>HR</span></div>
      </div>
      <nav class="tabs">
        <button data-tab="agent" class="active">Agent</button>
        <button data-tab="browser">Browser</button>
      </nav>
      <div id="urlbar" style="display:flex">
        <input id="url-input" placeholder="Enter a job URL…" />
        <button id="go">Go</button>
        <button id="capture">Capture</button>
        <button class="ext-icon-btn" id="ext-toggle" title="ghostHR">
          <img src="../build/icon.png" alt="ghostHR" />
        </button>
      </div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light theme">🌙</button>
    </header>

    <main>
      <section id="tab-agent" class="panel agent active">
        <div class="agent-browser" id="agent-browser">
        </div>
        <div class="chat-pane">
          <div class="chat" id="chat"></div>
          <div class="composer">
            <input id="agent-input" placeholder="Ask ghostHR about a job, your fit, or an application…" />
            <button id="agent-send">Send</button>
          </div>
        </div>
      </section>

      <section id="tab-browser" class="panel browser" style="display:none">
      </section>

      <aside class="side-panel" id="ext-panel">
        <div class="sp-head">
          <span>🛠 ghostHR</span>
          <button id="ext-close" title="Close">✕</button>
        </div>
      </aside>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
