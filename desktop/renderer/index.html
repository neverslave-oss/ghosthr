<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ghostHR</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #cccccc; --panel: #ffffff; --ink: #1a1a1a; --ink-dim: #666666;
        --accent: #8b5cf6; --accent-2: #06b6d4; --line: #d4d4d4; --ok: #16a34a;
      }
      /* Dark theme — the desktop is light by default; [data-theme="dark"]
         flips the palette to deep slate for night use. */
      [data-theme="dark"] {
        --bg: #0f172a; --panel: #1e293b; --ink: #e2e8f0; --ink-dim: #94a3b8;
        --accent: #8b5cf6; --accent-2: #06b6d4; --line: #334155; --ok: #34d399;
      }
      html, body { height: 100%; }
      body {
        background: var(--bg); color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex; flex-direction: column; overflow: hidden;
      }
      header {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand .mark {
        width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center;
        background: linear-gradient(135deg, #8b5cf6, #4f46e5); color: #fff; font-weight: 800;
      }
      .brand .title { font-weight: 700; }
      .brand .title span { color: var(--accent-2); }
      .tabs { display: flex; gap: 4px; margin-left: 16px; }
      .tabs button {
        background: transparent; border: none; color: var(--ink-dim); font-size: 14px;
        padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;
      }
      .tabs button.active { background: var(--accent); color: #fff; }
      /* Theme toggle — sits on the right end of the header. */
      .theme-toggle {
        margin-left: auto;
        background: transparent; border: 1px solid var(--line); color: var(--ink);
        width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
        font-size: 15px; display: grid; place-items: center;
      }
      .theme-toggle:hover { background: var(--panel); }
      #urlbar {
        flex: 1; margin-left: 16px; display: flex; gap: 6px;
      }
      #urlbar input {
        flex: 1; background: #fff; border: 1px solid var(--line); color: var(--ink);
        border-radius: 6px; padding: 6px 10px; font-size: 13px;
      }
      #urlbar button, #go {
        background: var(--accent); border: none; color: #fff; border-radius: 6px;
        padding: 6px 12px; cursor: pointer; font-weight: 600;
      }
      main { flex: 1; display: flex; min-height: 0; }
      .panel { flex: 1; display: none; flex-direction: column; min-width: 0; }
      .panel.active { display: flex; }
      /* Browser tab */
      .browser { padding: 8px; }
      webview {
        flex: 1; width: 100%; background: #fff; border-radius: 6px;
        border: 1px solid var(--line); min-height: 0;
      }
      .browser { display: flex; flex-direction: column; }
      /* Agent tab — split-screen chat + browser */
      .agent.split { flex-direction: row; }
      .agent .chat-pane {
        flex: 0 0 45%; display: flex; flex-direction: column; min-width: 0;
        border-right: 1px solid var(--line);
      }
      .agent .agent-browser {
        flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 8px;
      }
      .agent .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
      .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
      .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
      .msg.bot.streaming::after {
        content: '▍'; animation: blink 1s steps(2) infinite;
        color: var(--accent); margin-left: 2px;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .agent .composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
      .agent .composer input {
        flex: 1; background: #fff; border: 1px solid var(--line); color: var(--ink);
        border-radius: 6px; padding: 10px 12px; font-size: 14px;
      }
      .agent .composer button { background: var(--accent); border: none; color: #fff; border-radius: 6px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
      .empty { color: var(--ink-dim); }
      /* Settings panel */
      .settings-panel { flex: 1; overflow-y: auto; padding: 20px 28px; max-width: 720px; }
      .settings-panel .section { margin-bottom: 26px; }
      .settings-panel h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
      .settings-panel .hint { font-size: 12.5px; color: var(--ink-dim); margin-bottom: 10px; }
      .settings-panel .provider {
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        padding: 12px 14px; margin-bottom: 12px;
      }
      .settings-panel .provhead { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 4px; }
      .settings-panel .field-label { display: block; font-size: 12px; color: var(--ink-dim); margin: 8px 0 3px; }
      .settings-panel input[type="text"], .settings-panel input[type="password"], .settings-panel select {
        width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink);
        border-radius: 6px; padding: 8px 10px; font-size: 13px;
      }
      .settings-actions { display: flex; gap: 10px; margin-top: 8px; }
      .settings-actions button, .file-btn {
        border-radius: 6px; padding: 10px 16px; cursor: pointer; font-weight: 600; font-size: 13px;
      }
      .settings-actions .primary { background: var(--accent); border: none; color: #fff; }
      .settings-actions .ghost, .file-btn { background: var(--panel); border: 1px solid var(--line); color: var(--ink); }
      #settings-status { margin-top: 10px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="mark">HR</div>
        <div class="title">ghost<span>HR</span></div>
      </div>
      <nav class="tabs">
        <button data-tab="agent" class="active">Agent</button>
        <button data-tab="browser">Browser</button>
        <button data-tab="settings">Settings</button>
      </nav>
      <div id="urlbar" style="display:none">
        <input id="url-input" placeholder="Enter a job URL…" />
        <button id="go">Go</button>
        <button id="capture">Capture page</button>
      </div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light theme">🌙</button>
    </header>

    <main>
      <section id="tab-agent" class="panel agent active">
        <div class="chat-pane">
          <div class="chat" id="chat"></div>
          <div class="composer">
            <input id="agent-input" placeholder="Ask ghostHR about a job, your fit, or an application…" />
            <button id="agent-send">Send</button>
          </div>
        </div>
        <div class="agent-browser" id="agent-browser" style="display:none">
        </div>
      </section>

      <section id="tab-browser" class="panel browser" style="display:none">
      </section>

      <section id="tab-settings" class="panel settings" style="display:none">
        <div id="settings-root"></div>
      </section>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
