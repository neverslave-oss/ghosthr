<!DOCTYPE html>
<html lang="en" data-ghosthr-shell="1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ghostHR</title>
    <style>
      /* ======================================================================
         ghostHR desktop — chrome stylesheet.
         Matches the extension popup design language: deep slate base, glass
         surfaces, sky→indigo accent gradient (src/popup/style.css).
         ====================================================================== */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0b1120;
        --bg-soft: #0f172a;
        --card: rgba(30, 41, 59, 0.55);
        --card-border: rgba(148, 163, 184, 0.14);
        --line: rgba(148, 163, 184, 0.12);
        --ink: #e5edf7;
        --ink-dim: #8b9bb4;
        --ink-faint: #61718c;
        --accent-1: #38bdf8;
        --accent-2: #818cf8;
        --accent-grad: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        --surface: rgba(15, 23, 42, 0.5);
        --surface-soft: rgba(15, 23, 42, 0.4);
        --input-bg: rgba(2, 6, 23, 0.55);
        --header-bg: rgba(15, 23, 42, 0.85);
        --radius: 14px;
        --shadow: 0 8px 28px rgba(2, 6, 23, 0.6);
        --focus-ring: 0 0 0 3px rgba(56, 189, 248, 0.25);
      }
      [data-theme="light"] {
        --bg: #cccccc;
        --bg-soft: #e2e2e2;
        --card: #ffffff;
        --card-border: rgba(15, 23, 42, 0.10);
        --line: rgba(15, 23, 42, 0.14);
        --ink: #1a1a1a;
        --ink-dim: #5a6b83;
        --ink-faint: #8899b3;
        --accent-1: #0284c7;
        --accent-2: #6d5ce0;
        --accent-grad: linear-gradient(135deg, #0284c7 0%, #6d5ce0 100%);
        --surface: rgba(255, 255, 255, 0.72);
        --surface-soft: rgba(255, 255, 255, 0.6);
        --input-bg: #ffffff;
        --header-bg: rgba(255, 255, 255, 0.85);
        --shadow: 0 8px 28px rgba(15, 23, 42, 0.18);
        --focus-ring: 0 0 0 3px rgba(2, 132, 199, 0.22);
      }
      html, body { height: 100%; }
      body {
        display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        background:
          radial-gradient(1000px 500px at 85% -10%, rgba(129, 140, 248, 0.10), transparent 60%),
          radial-gradient(800px 420px at 0% 110%, rgba(56, 189, 248, 0.08), transparent 55%),
          var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button { font-family: inherit; transition: background .15s ease, color .15s ease, box-shadow .15s ease, filter .15s ease, border-color .15s ease; }
      button:active { transform: translateY(0.5px); }

      /* ---------- Toolbar ---------- */
      header {
        display: flex; align-items: center; gap: 10px;
        height: 54px; padding: 0 12px; flex: 0 0 auto;
        background: var(--header-bg);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 9px; padding-right: 2px; }
      .mark {
        width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center;
        background: var(--accent-grad); color: #fff; font-weight: 800; font-size: 12px;
        letter-spacing: .02em; box-shadow: 0 2px 10px rgba(56, 189, 248, 0.35);
      }
      .title { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
      .title span {
        background: var(--accent-grad);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }

      /* Segmented view switcher */
      .tabs {
        display: flex; gap: 2px; padding: 3px;
        background: var(--surface-soft); border: 1px solid var(--line); border-radius: 999px;
      }
      .tabs button {
        background: transparent; border: none; color: var(--ink-dim); cursor: pointer;
        padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
      }
      .tabs button:hover { color: var(--ink); }
      .tabs button.active { background: var(--accent-grad); color: #fff; box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3); }

      /* Back / forward / reload */
      .nav-btns { display: flex; gap: 2px; }
      .nav-btns button {
        display: grid; place-items: center;
        background: transparent; border: none; color: var(--ink-dim); cursor: pointer;
        width: 32px; height: 32px; border-radius: 999px;
      }
      .nav-btns button:hover { background: var(--surface); color: var(--ink); }
      .nav-btns svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      /* URL pill + capture */
      #urlbar { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
      .url-pill {
        flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
        height: 36px; padding: 0 5px 0 13px;
        background: var(--input-bg); border: 1px solid var(--line); border-radius: 999px;
      }
      .url-pill:focus-within { border-color: var(--accent-1); box-shadow: var(--focus-ring); }
      .url-pill .lock { width: 13px; height: 13px; flex: 0 0 auto; stroke: var(--ink-faint); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .url-pill input {
        flex: 1; min-width: 0; background: transparent; border: none; outline: none;
        color: var(--ink); font-size: 13px;
      }
      .url-pill input::placeholder { color: var(--ink-faint); }
      #go {
        flex: 0 0 auto; display: grid; place-items: center;
        width: 27px; height: 27px; border-radius: 999px; border: none; cursor: pointer;
        background: var(--accent-grad); color: #fff;
      }
      #go:hover { filter: brightness(1.08); }
      #go svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      #capture {
        display: flex; align-items: center; gap: 7px;
        height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer;
        background: var(--surface-soft); border: 1px solid var(--line);
        color: var(--ink); font-size: 12.5px; font-weight: 700; white-space: nowrap;
      }
      #capture:hover { border-color: var(--accent-1); color: var(--accent-1); }
      #capture:disabled { opacity: .55; cursor: wait; }
      #capture svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      /* Pinned extension action — toggles the ghostHR side panel. */
      .ext-action {
        width: 32px; height: 32px; border-radius: 10px; border: none; cursor: pointer;
        background: var(--accent-grad); color: #fff; font-weight: 800; font-size: 11px;
        box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
      }
      .ext-action:hover { filter: brightness(1.08); }
      .ext-action.active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent-1); }
      .theme-toggle {
        display: grid; place-items: center;
        width: 32px; height: 32px; border-radius: 999px; cursor: pointer;
        background: transparent; border: none; color: var(--ink-dim); font-size: 15px;
      }
      .theme-toggle:hover { background: var(--surface); color: var(--ink); }

      /* ---------- Content area ---------- */
      main { flex: 1; display: flex; min-width: 0; min-height: 0; }
      .tab-area { flex: 1; display: flex; min-width: 0; min-height: 0; }
      .panel { flex: 1; display: none; flex-direction: column; min-width: 0; min-height: 0; }
      .panel.active { display: flex; }

      /* Browser tab — the native WebContentsView docks over this region
         (margins reveal the backdrop as a frame; view corners are rounded
         natively via setBorderRadius). */
      .browser { margin: 12px; border-radius: var(--radius); background: var(--surface-soft); }

      /* ghostHR side panel region — the native extension page view docks here. */
      #sidepanel-host {
        flex: 0 0 400px; display: none; min-width: 0; min-height: 0;
        margin: 12px 12px 12px 0; border-radius: var(--radius);
        background: var(--surface-soft);
      }
      #sidepanel-host.open { display: block; }

      /* Agent tab — split-screen. Browser LEFT, chat RIGHT. */
      .agent { flex-direction: row; }
      .agent .agent-browser {
        flex: 1; min-width: 0; margin: 12px;
        border-radius: var(--radius); background: var(--surface-soft);
      }
      .agent .chat-pane {
        flex: 0 0 40%; display: flex; flex-direction: column; min-width: 0;
        margin: 12px 12px 12px 0; border-radius: var(--radius);
        background: var(--card); border: 1px solid var(--card-border);
        box-shadow: var(--shadow); overflow: hidden;
        backdrop-filter: blur(10px);
      }
      .agent .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .chat::-webkit-scrollbar { width: 8px; }
      .chat::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 999px; }
      .chat::-webkit-scrollbar-track { background: transparent; }
      .msg { max-width: 85%; padding: 10px 14px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
      .msg.user {
        align-self: flex-end; background: var(--accent-grad); color: #fff;
        border-radius: 14px 14px 4px 14px; box-shadow: 0 2px 10px rgba(56, 189, 248, 0.25);
      }
      .msg.bot {
        align-self: flex-start; background: var(--surface); color: var(--ink);
        border: 1px solid var(--card-border); border-radius: 14px 14px 14px 4px;
      }
      .msg.bot.streaming::after { content: '▍'; animation: blink 1s steps(2) infinite; color: var(--accent-1); margin-left: 2px; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .agent .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--surface-soft); }
      .agent .composer input {
        flex: 1; min-width: 0; height: 38px; padding: 0 14px;
        background: var(--input-bg); border: 1px solid var(--line); border-radius: 999px;
        color: var(--ink); font-size: 13.5px; outline: none;
      }
      .agent .composer input::placeholder { color: var(--ink-faint); }
      .agent .composer input:focus { border-color: var(--accent-1); box-shadow: var(--focus-ring); }
      .agent .composer button {
        height: 38px; padding: 0 18px; border: none; border-radius: 999px; cursor: pointer;
        background: var(--accent-grad); color: #fff; font-weight: 700; font-size: 13px;
      }
      .agent .composer button:hover { filter: brightness(1.08); }
      .empty { color: var(--ink-dim); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="mark">HR</div>
        <div class="title">ghost<span>HR</span></div>
      </div>
      <nav class="tabs">
        <button data-tab="browser" class="active">Browser</button>
        <button data-tab="agent">Agent</button>
      </nav>
      <div class="nav-btns">
        <button id="nav-back" title="Back">
          <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button id="nav-forward" title="Forward">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <button id="nav-reload" title="Reload">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        </button>
      </div>
      <div id="urlbar">
        <div class="url-pill">
          <svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="url-input" placeholder="Search or enter a job URL…" />
          <button id="go" title="Go">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
        <button id="capture" title="Capture and scan the current page">
          <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span id="capture-label">Capture</span>
        </button>
      </div>
      <button class="ext-action active" id="ghosthr-action" title="ghostHR side panel">HR</button>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light theme">🌙</button>
    </header>

    <main>
      <div class="tab-area">
        <section id="tab-agent" class="panel agent">
          <div class="agent-browser" id="agent-browser">
          </div>
          <div class="chat-pane">
            <div class="chat" id="chat"></div>
            <div class="composer">
              <input id="agent-input" placeholder="Ask ghostHR about a job, your fit, or an application…" />
              <button id="agent-send">Send</button>
            </div>
          </div>
        </section>

        <section id="tab-browser" class="panel browser active">
        </section>
      </div>
      <aside id="sidepanel-host" class="open"></aside>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
